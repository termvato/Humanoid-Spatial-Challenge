[project]
name = "roomdiff"
version = "0.1.0"
description = "3D change detection between two phone videos of a room"
authors = [
    { name = "vakhtang inasaridze", email = "inasaridzevato@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.6.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pycocotools>=2.0.11",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# ROS 2 Jazzy on PYTHONPATH registers pytest plugins that crash in this env.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_xmllint -p no:ament_lint -p no:ament_pep257"

[tool.ruff]
line-length = 110
